name: Test Docker Bake

on:
  workflow_dispatch:
    inputs:
      test-scope:
        description: 'Run annotation scenarios, scan scenarios, or every fixture'
        required: false
        type: choice
        options:
          - all
          - annotations
          - scan
        default: all
  release:
    types: [published]

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - id: set-version
        run: |
          echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

  build-images-multi-target-mixed-arch:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'annotations' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      bake-file: ./testdir/testsubdir/docker-bake-multi-target-mixed-arch.hcl
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false

  build-images-single-target-multi-arch:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'annotations' || inputs.test-scope == 'all' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false

  build-images-multi-target-single-arch:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'annotations' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    with:
      bake-file: docker-bake-multi-target-single-arch.hcl
      group: somegroup
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false
    secrets: inherit

  build-images-single-target-single-arch:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'annotations' || inputs.test-scope == 'all' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    with:
      bake-file: docker-bake-single-target-single-arch.hcl
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false
    secrets: inherit

  build-image-with-secrets:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    with:
      bake-file: docker-bake.hcl
      group: secretgroup
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false
    secrets: inherit

  scan-clean-image:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'scan' }}
    needs: determine-version
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      bake-file: docker-bake-scan.hcl
      group: scan-clean
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: true

  scan-vuln-image-fail-disabled:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'scan' }}
    needs:
      - determine-version
      - scan-clean-image
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      bake-file: docker-bake-scan.hcl
      group: scan-vuln-image-fail-disabled
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false

  scan-vuln-image-with-ignore:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'scan' }}
    needs:
      - determine-version
      - scan-vuln-image-fail-disabled
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      bake-file: docker-bake-scan.hcl
      group: scan-vuln-image-with-ignore
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: true
      trivyignore-file: testdir/custom.trivyignore

  scan-nonexistent-ignorefile:
    if: ${{ github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'scan' }}
    needs:
      - determine-version
      - scan-vuln-image-with-ignore
    uses: k-candidate/gha-workflows/.github/workflows/docker-bake.yaml@scan
    secrets: inherit
    with:
      bake-file: docker-bake-scan.hcl
      group: scan-nonexistent-ignorefile
      version: ${{ needs.determine-version.outputs.version }}
      fail-on-scan-findings: false
      trivyignore-file: does-not-exist.trivyignore

  assert-scan-gate-failed:
    if: ${{ always() && needs.scan-nonexistent-ignorefile.result == 'success' && (github.event_name == 'release' || inputs.test-scope == 'all' || inputs.test-scope == 'scan') }}
    needs:
      - scan-nonexistent-ignorefile
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger the expected-failure reusable-workflow run
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DISPATCHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          gh workflow run test.yaml \
            --repo "$GH_REPO" --ref scan

          for attempt in {1..24}; do
            RUNS=$(gh run list \
              --repo "$GH_REPO" \
              --workflow test.yaml \
              --branch scan \
              --limit 20 \
              --json databaseId,createdAt,headSha,event)
            RUN_ID=$(echo "$RUNS" | jq -r \
              --arg sha "$GH_SHA" \
              --arg dispatched_at "$DISPATCHED_AT" \
              '[.[] | select(.headSha == $sha and .event == "workflow_dispatch" and .createdAt >= $dispatched_at)] | sort_by(.createdAt) | last | .databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Watching expected-failure workflow run $RUN_ID"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Could not find the dispatched expected-failure test run"
          exit 1

      - name: Wait for the expected gate failure
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo "$GH_REPO" --exit-status

      - name: Assert findings caused the expected gate failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          CONCLUSION=$(gh run view "$RUN_ID" --repo "$GH_REPO" --json conclusion --jq .conclusion)
          if [ "$CONCLUSION" != "failure" ]; then
            echo "::error::Expected the vulnerable image workflow to fail its scan gate; got $CONCLUSION"
            exit 1
          fi
          echo "The vulnerable image failed at the scan gate as expected."
